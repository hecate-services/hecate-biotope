# Build the OCI image for hecate-biotope and push to ghcr.io.
#
# GitHub is canonical since 2026-07-26, so this runs where the code lives.
# Pushes BOTH :latest and the semver tag. The deployed .container/compose tracks
# :latest under watchtower for zero-touch deploys, and the semver tags stay on
# ghcr so a bad release can be pinned back to a known one.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # WHICH WORLD THIS IMAGE IS, so a past one can be pulled back.
      #
      # `world-13` is the last build made while the physics said world 13, and it
      # stays pullable for ever because the tag only moves while that world is
      # the current one. So the CURRENT world's tag tracks main and every
      # FINISHED world's tag is frozen at its last build, which is exactly what
      # switching back and forth wants.
      #
      # It reads `world:ruleset/0` through scripts/world_number.sh rather than
      # naming a number here, because a version in two places is a version that
      # drifts, and this one has drifted before: world 13's physics shipped
      # labelled world 12.
      - name: Which world
        id: world
        run: echo "n=$(./scripts/world_number.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/hecate-services/hecate-biotope:latest
            ghcr.io/hecate-services/hecate-biotope:${{ steps.tag.outputs.tag }}
            ghcr.io/hecate-services/hecate-biotope:world-${{ steps.world.outputs.n }}
